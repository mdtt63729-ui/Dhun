# ─────────────────────────────────────────────────────────────
# Release — Signed Universal APK
#
# Builds ONLY ONE Universal APK.
#
# Manual:
#   Actions → Release Build → Run workflow
#   → Universal APK is uploaded as an Actions artifact.
#
# Tag:
#   Push a tag such as:
#     v3.0.8
#   → Builds Universal APK
#   → Creates GitHub Release
#   → Attaches ONE APK to the release
#
# Repository Secrets required:
#
#   SIGNING_KEY
#   KEY_STORE_PASSWORD
#   ALIAS
#   KEY_PASSWORD
#
# SIGNING_KEY must contain the Base64 encoded release keystore.
# ─────────────────────────────────────────────────────────────

name: Release Build

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:
    name: Build Universal Release APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to gradlew
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

      - name: Extract app version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          fi

          VERSION=$(
            grep 'versionName = ' app/build.gradle.kts \
            | grep -oP '"[^"]+"' \
            | head -n 1 \
            | tr -d '"'
          )

          if [ -z "$VERSION" ]; then
            echo "::error::Could not find versionName in app/build.gradle.kts."
            exit 1
          fi

          echo "App version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::SIGNING_KEY is not available."
            exit 1
          fi
          CLEAN_SIGNING_KEY="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          if [ -z "$CLEAN_SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY is empty."
            exit 1
          fi
          if ! printf '%s' "$CLEAN_SIGNING_KEY" | base64 --decode > app/keystore/release.keystore 2>/tmp/err.log; then
            echo "::error::SIGNING_KEY could not be decoded as Base64."
            cat /tmp/err.log || true
            rm -f app/keystore/release.keystore
            exit 1
          fi
          if [ ! -s app/keystore/release.keystore ]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi
          echo "Release keystore decoded successfully."

      - name: Build signed Universal release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleUniversalRelease --no-daemon --stacktrace

      - name: Locate Universal APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK_PATH=""
          if [ -d "app/build/outputs/apk/universal/release" ]; then
            APK_PATH=$(find app/build/outputs/apk/universal/release -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | grep -Ei 'universal|release' | head -n 1 || true)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Universal release APK was not found."
            exit 1
          fi
          DEST="artifacts/Dhun-v${{ steps.version.outputs.version }}-universal-release.apk"
          cp "$APK_PATH" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Verify Universal APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.path }}"
          if [ ! -f "$APK" ]; then
            echo "::error::APK does not exist."
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -le 0 ]; then
            echo "::error::APK file is empty."
            exit 1
          fi

      - name: Upload Universal APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Dhun-v${{ steps.version.outputs.version }}-universal-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove decoded release keystore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/keystore/release.keystore

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Universal APK
        uses: actions/download-artifact@v6
        with:
          pattern: "Dhun-*-universal-release"
          path: release-apks
          merge-multiple: true

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_COUNT=$(find release-apks -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly ONE Universal APK, found $APK_COUNT."
            exit 1
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
